[build-system]
requires = ["setuptools>=69,<76", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "iclots"
version = "2.0.0a1"
description = "Scientific image analysis with explicit legacy-compatible measurement policies"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.9,<6.10", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4"]
analysis = [
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "trackpy==0.7",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-image==0.23.2",
  "scikit-learn==1.4.2",
]
test = ["pytest>=7.4,<10"]
build = ["build>=1.2,<2"]

[project.scripts]
iclots = "iclotspython.launcher:main"

[project.urls]
Repository = "https://github.com/cbain31/iCLOTS"

[tool.setuptools.packages.find]
include = ["iclotspython*"]
exclude = ["tests*", "data*", "iCLOTS_softwareonly*"]

[tool.setuptools]
include-package-data = false
